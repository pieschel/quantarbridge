name: Raspberry Pi ARM64 image

on:
  workflow_dispatch:
  push:
    branches:
      - agent/raspberry-pi-image
      - agent/raspberry-pi-image-*
    tags:
      - v*
    paths:
      - .github/workflows/raspberry-pi-image.yml
      - CMakeLists.txt
      - dashboard/**
      - deploy/**
      - docs/**
      - image/**
      - patches/**
      - scripts/**
      - src/**
      - tests/**

permissions:
  contents: write
  packages: write

concurrency:
  group: raspberry-pi-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Check out QuantarBridge
        uses: actions/checkout@v5

      - name: Build and validate ARM64 image
        run: >-
          sudo
          --preserve-env=GITHUB_SHA,GITHUB_REF_TYPE,GITHUB_REF_NAME,RUNNER_TEMP
          bash image/build-rpi-image.sh

      - name: Set up ORAS
        if: startsWith(github.ref, 'refs/tags/v')
        uses: oras-project/setup-oras@v1

      - name: Publish Raspberry Pi image package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_path="$(find dist -maxdepth 1 -type f -name '*.img.xz' -print -quit)"
          checksum_path="${image_path}.sha256"
          echo "${GHCR_TOKEN}" | oras login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          oras push \
            --artifact-type application/vnd.quantarbridge.raspberrypi.image.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --annotation "org.opencontainers.image.title=QuantarBridge Raspberry Pi ARM64 image" \
            --format json \
            "ghcr.io/${owner}/quantarbridge-rpi-image:${GITHUB_REF_NAME},latest" \
            "${image_path}:application/vnd.raspberrypi.image.layer.v1+xz" \
            "${checksum_path}:text/plain" \
            "dist/BUILD-INFO.txt:text/plain" \
            "dist/ARM64-FILE-CHECK.txt:text/plain" \
            "dist/SSH-LOGIN-CHECK.txt:text/plain" | tee dist/OCI-MANIFEST.json

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_file="release-notes/${GITHUB_REF_NAME}.md"
          notes_args=(--generate-notes)
          if [[ -f "${notes_file}" ]]; then
            notes_args=(--notes-file "${notes_file}")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.img.xz \
            dist/*.img.xz.sha256 \
            dist/BUILD-INFO.txt \
            dist/ARM64-FILE-CHECK.txt \
            dist/SSH-LOGIN-CHECK.txt \
            dist/OCI-MANIFEST.json \
            --verify-tag \
            --latest \
            --title "QuantarBridge ${GITHUB_REF_NAME}" \
            "${notes_args[@]}"

      - name: Upload flashable image
        uses: actions/upload-artifact@v4
        with:
          name: quantarbridge-rpios-arm64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
